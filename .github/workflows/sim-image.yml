name: Build GPU simulation image

# Rebuilds the image used by RunPod machines whenever its recipe or the Python
# requirements change, and stores it in this account's GitHub image registry
# as ghcr.io/<owner>/laundry-bot-sim.
on:
  push:
    branches: [main]
    paths:
      - docker/**
      - requirements.txt
      - requirements-cloud.txt
      - .github/workflows/sim-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sim.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/laundry-bot-sim:latest
            ghcr.io/${{ github.repository_owner }}/laundry-bot-sim:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
